<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>نطّة السطوح · Natta El Sotouh</title>
<meta name="description" content="Bounce up a Cairo apartment building to the rooftops and into the sky with Mar3y.">
<meta name="theme-color" content="#f2b531">
<meta property="og:title" content="نطّة السطوح · Natta El Sotouh">
<meta property="og:description" content="Bounce up the balconies to the rooftops with Mar3y.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game" dir="rtl">
  <canvas id="cv" aria-label="Game screen"></canvas>

  <div id="hud" class="hidden">
    <div class="stat"><b id="vHeight">٠</b><small id="uHeight">م</small></div>
    <div class="stat coin"><img data-sprite="item:coin:0" alt=""><b id="vCoins">٠</b></div>
  </div>
  <button class="round" id="pauseBtn" type="button"><img data-sprite="item:pause:0" alt=""></button>
  <button class="round" id="muteBtn" type="button"><img id="muteImg" data-sprite="item:soundOn:0" alt=""></button>
  <div id="dailyChip" class="chip hidden"></div>
  <div id="pop" aria-live="polite"></div>

  <section class="screen show" id="splash" aria-label="Loading">
    <img class="splash-hero" data-sprite="hero:marei:slouch" alt="">
    <p class="splash-text" data-t="title">نطّة السطوح</p>
  </section>

  <section class="screen" id="menu" aria-label="Main menu">
    <div class="menu-col">
      <div class="logo">
        <img class="logo-hero" id="menuHero" alt="Mar3y">
        <h1 class="title" data-t="title">نطّة السطوح</h1>
        <p class="latin">NATTA EL SOTOUH</p>
      </div>
      <p class="tag" data-t="tagline"></p>
      <button class="btn big" type="button" id="btnPlay" data-t="play"></button>
      <div class="row">
        <button class="btn" type="button" id="btnDaily"><span data-t="daily"></span><i class="dot hidden" id="dailyDot"></i></button>
        <button class="btn" type="button" id="btnHeroes" data-t="shop"></button>
      </div>
      <div class="row">
        <button class="btn ghost" type="button" id="btnControls"><span data-t="controls"></span>: <span id="controlsState"></span></button>
        <button class="btn ghost" type="button" id="btnLang" data-t="langBtn"></button>
      </div>
      <p class="status"><span data-t="best"></span>: <b id="menuBest">٠</b> <span data-t="m"></span> · <span data-t="coins"></span>: <b id="menuCoins">٠</b></p>
      <p class="hint" id="menuHint"></p>
    </div>
  </section>

  <section class="screen" id="hangar" aria-label="Heroes">
    <div class="bar"><button class="btn small" type="button" id="hangarBack" data-t="back"></button><div class="stat coin static"><img data-sprite="item:coin:0" alt=""><b id="hangarCoins">٠</b></div></div>
    <h2 class="h2" data-t="shop"></h2>
    <div class="tabs" id="shopTabs">
      <button type="button" data-tab="heroes" data-t="heroes"></button>
      <button type="button" data-tab="look" data-t="tabLook"></button>
      <button type="button" data-tab="ups" data-t="tabUps"></button>
    </div>
    <div class="cards" id="heroList"></div>
    <div class="look-stage hidden" id="lookStage"></div>
    <div class="cards" id="lookPane"></div>
    <div class="cards" id="upList"></div>
  </section>

  <section class="screen" id="daily" aria-label="Daily challenge">
    <div class="bar"><button class="btn small" type="button" id="dailyBack" data-t="back"></button><div class="stat coin static"><img data-sprite="item:coin:0" alt=""><b id="dailyCoins">٠</b></div></div>
    <h2 class="h2" data-t="daily"></h2>
    <div class="cards" id="dailyBody"></div>
    <button class="btn big" type="button" id="dailyStart"></button>
  </section>

  <section class="screen dim" id="pause" aria-label="Paused">
    <div class="panel">
      <h2 class="h2" data-t="paused"></h2>
      <button class="btn big" type="button" id="btnResume" data-t="resume"></button>
      <button class="btn ghost" type="button" id="btnQuit" data-t="menu"></button>
    </div>
  </section>

  <section class="screen dim" id="over" aria-label="Game over">
    <div class="panel">
      <div id="overHeroBox"></div>
      <h2 class="h2" id="overTitle"></h2>
      <p class="badge" id="overBest" data-t="newBest"></p>
      <div class="results">
        <div><small data-t="height"></small><b id="overHeight">٠</b></div>
        <div><small data-t="earned"></small><b id="overCoins">٠</b></div>
      </div>
      <p class="status" id="overBestLine"></p>
      <p class="status over-daily" id="overDaily"></p>
      <div class="over-missions" id="overMissions"></div>
      <button class="btn big" type="button" id="btnRetry" data-t="retry"></button>
      <div class="row">
        <button class="btn ghost" type="button" id="btnOverHeroes" data-t="shop"></button>
        <button class="btn ghost" type="button" id="btnOverMenu" data-t="menu"></button>
      </div>
    </div>
  </section>

  <section class="screen dim" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="panel">
      <h2 class="h2" id="confirmTitle"></h2>
      <p class="status" id="confirmBody"></p>
      <button class="btn big" type="button" id="confirmYes"></button>
      <button class="btn ghost" type="button" id="confirmNo" data-t="cancel"></button>
    </div>
  </section>
  <div id="runHint" class="hidden" aria-live="polite"><div class="hand-track"><svg class="hand" viewBox="0 0 40 48" aria-hidden="true"><path d="M14 22V8a4 4 0 0 1 8 0v12l12 3c3 .8 4 2.500 3.500 6l-2 12c-.5 3-2.500 5-5.500 5H18c-3 0-5-1.500-6.500-4L5 29c-1-2 1-4 3.500-3z" fill="#fffaf0" stroke="#1d1612" stroke-width="3" stroke-linejoin="round"/></svg></div><b id="runHintText"></b></div>
  <p id="toast" role="status"></p>
</div>
<script src="art/core.js"></script>
<script src="src/data.js"></script>
<script src="art/heroes.js"></script>
<script src="art/shams.js"></script>
<script src="art/crew.js"></script>
<script src="art/hanafy.js"></script>
<script src="art/batta.js"></script>
<script src="art/hadeel.js"></script>
<script src="art/shawish.js"></script>
<script src="art/looks.js"></script>
<script src="art/platforms.js"></script>
<script src="art/enemies.js"></script>
<script src="art/items.js"></script>
<script src="art/world.js"></script>
<script src="art/sprites.js"></script>
<script src="src/save.js"></script>
<script src="src/shop.js"></script>
<script src="src/daily.js"></script>
<script src="src/perks.js"></script>
<script src="src/twist.js"></script>
<script src="src/strings.js"></script>
<script src="src/audio.js"></script>
<script src="src/engine.js"></script>
<script src="src/input.js"></script>
<script src="src/gen.js"></script>
<script src="src/play.js"></script>
<script src="src/looks.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/shopui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
